# Starter pipeline
# Start with a minimal pipeline that you can customize to build and deploy your code.
# Add steps that build, run tests, deploy, and more:
# https://aka.ms/yaml

trigger:
  branches:
    include:
      - main
  paths:
    include:
      - projects/iatec/nephos-blocks/**

pr: none

pool:
  name: IATec-Builds-Agents-Linux

variables:
  - group: nuget-credentials

steps:
  - task: NodeTool@0
    displayName: 'Update Node.js'
    inputs:
      versionSpec: '20.x'

  - task: CmdLine@2
    displayName: 'Rename .npmrc.pipeline To .npmrc'
    inputs:
      script: 'mv .npmrc.pipeline .npmrc'

  - task: replacetokens@6
    displayName: 'Replace variables in .npmrc'
    inputs:
      targetFiles: '**/.npmrc'
      encoding: 'auto'
      writeBOM: true
      actionOnMissing: 'warn'
      keepToken: false
      tokenPrefix: '#{'
      tokenSuffix: '}#'

  - task: Npm@1
    displayName: 'Install'
    inputs:
      command: 'install'
      workingDir: '$(Build.SourcesDirectory)'

  # Bloco depende de átomo: o `tsconfig.lib.json` daqui resolve o
  # `@iatec/nephos-ui` pelo pacote CONSTRUÍDO (o ng-packagr não compila o
  # fonte de outra lib dentro deste). Por isso o passo abaixo — sem ele o
  # build quebra no agente. Este artefato NÃO é publicado; só alimenta a
  # compilação.
  - task: Npm@1
    displayName: 'Build - @iatec/nephos-ui (dependência)'
    inputs:
      command: 'custom'
      customCommand: 'run ng build @iatec/nephos-ui'
      workingDir: '$(Build.SourcesDirectory)'

  - task: Npm@1
    displayName: 'Build - @iatec/nephos-blocks'
    inputs:
      command: 'custom'
      customCommand: 'run ng build @iatec/nephos-blocks'
      workingDir: '$(Build.SourcesDirectory)'

  - task: npmAuthenticate@0
    displayName: Authenticate
    inputs:
      workingFile: .npmrc

  - task: Npm@1
    displayName: Publish
    inputs:
      command: publish
      publishRegistry: useFeed
      publishFeed: IATec.Community
      workingDir: '$(Build.SourcesDirectory)/dist/iatec/nephos-blocks'

  - task: CmdLine@2
    displayName: 'Remove .npmrc'
    inputs:
      script: 'rm -r .npmrc'
