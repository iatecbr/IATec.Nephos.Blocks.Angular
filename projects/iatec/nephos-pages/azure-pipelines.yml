# Starter pipeline
# Start with a minimal pipeline that you can customize to build and deploy your code.
# Add steps that build, run tests, deploy, and more:
# https://aka.ms/yaml

trigger:
  branches:
    include:
      - main
  paths:
    include:
      - projects/iatec/nephos-pages/**

pr: none

pool:
  name: IATec-Builds-Agents-Linux

variables:
  - group: nuget-credentials

steps:
  - task: NodeTool@0
    displayName: 'Update Node.js'
    inputs:
      versionSpec: '20.x'

  - task: CmdLine@2
    displayName: 'Rename .npmrc.pipeline To .npmrc'
    inputs:
      script: 'mv .npmrc.pipeline .npmrc'

  - task: replacetokens@6
    displayName: 'Replace variables in .npmrc'
    inputs:
      targetFiles: '**/.npmrc'
      encoding: 'auto'
      writeBOM: true
      actionOnMissing: 'warn'
      keepToken: false
      tokenPrefix: '#{'
      tokenSuffix: '}#'

  - task: Npm@1
    displayName: 'Install'
    inputs:
      command: 'install'
      workingDir: '$(Build.SourcesDirectory)'

  # Página depende de átomo desde 04/08/2026 (os templates `listing`,
  # `detail-form` e `dashboard` usam o `heading` e a camada de token): o
  # `tsconfig.lib.json` daqui resolve o `@iatec/nephos-ui` pelo pacote
  # CONSTRUÍDO, porque o ng-packagr não compila o fonte de outra lib
  # dentro desta. Sem o passo abaixo o build quebra no agente, com uma
  # mensagem que não diz nada ("Cannot destructure property 'pos'").
  # Este artefato NÃO é publicado aqui; só alimenta a compilação.
  # Mesmo passo que o pipeline do `@iatec/nephos-blocks` já tem.
  - task: Npm@1
    displayName: 'Build - @iatec/nephos-ui (dependência)'
    inputs:
      command: 'custom'
      customCommand: 'run ng build @iatec/nephos-ui'
      workingDir: '$(Build.SourcesDirectory)'

  - task: Npm@1
    displayName: 'Build - @iatec/nephos-pages'
    inputs:
      command: 'custom'
      customCommand: 'run ng build @iatec/nephos-pages'
      workingDir: '$(Build.SourcesDirectory)'

  - task: npmAuthenticate@0
    displayName: Authenticate
    inputs:
      workingFile: .npmrc

  - task: Npm@1
    displayName: Publish
    inputs:
      command: publish
      publishRegistry: useFeed
      publishFeed: IATec.Community
      workingDir: '$(Build.SourcesDirectory)/dist/iatec/nephos-pages'

  - task: CmdLine@2
    displayName: 'Remove .npmrc'
    inputs:
      script: 'rm -r .npmrc'
