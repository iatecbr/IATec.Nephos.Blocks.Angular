    <div class="layout-container">
      <!-- Sidebar Compacto -->

            </div>

          <!-- Menu -->
          <div class="sidebar-menu-group">
            <!-- Separador -->
            <div class="menu-separator">
              <div class="divider"></div>
            </div>
            
            <!-- Itens do Menu -->
            <ul class="layout-menu">
              <li class="layout-menuitem">
                <a class="active-menuitem">
                  <i class="fa-solid fa-table-cells-large layout-menuitem-icon"></i>
                </a>
              </li>
              <li class="layout-menuitem">
                <a>
                  <i class="fa-solid fa-user layout-menuitem-icon"></i>
                </a>
              </li>
              <li class="layout-menuitem">
                <a>
                  <i class="fa-solid fa-chart-column layout-menuitem-icon"></i>
                </a>
              </li>
              <li class="layout-menuitem">
                <a>
                  <i class="fa-solid fa-gear layout-menuitem-icon"></i>
                </a>
              </li>
              <li class="layout-menuitem">
                <a>
                  <i class="fa-solid fa-inbox layout-menuitem-icon"></i>
                </a>
              </li>
              <li class="layout-menuitem">
                <a>

          <button class="sidebar-action-button">
            <i class="fa-solid fa-plus"></i>

        </div>

      <!-- Botão de Toggle -->
      <button class="sidebar-toggle-button">
        <i class="fa-solid fa-chevron-right"></i>
      </button>
      
      <!-- Conteúdo Principal -->
      <div class="layout-main-container">
        <div class="layout-main">
          <!-- Header/Topbar -->
          <header class="layout-topbar">
            <div class="topbar-content">
              <!-- Breadcrumb -->
              <div class="breadcrumb-section">
                <!-- Eram `#94A3B8` (slate-400), `#64748B` (slate-500), `7px` e `14px` fixos.
                     Trocados pelo papel e pela escala: `--text-color-secondary` e o texto de
                     apoio que o proprio layout ja declara em `variables/_common.scss`,
                     `--nph-space-sm` = 0.5rem (= 7px no root de 14px) e
                     `--nph-font-size-body-sm` = 14px. Nenhuma medida mudou de tamanho; o que
                     mudou e que agora acompanham o modo claro/escuro e a escala. -->
                <i class="fa-solid fa-house" style="color: var(--text-color-secondary); margin-right: var(--nph-space-sm, 0.5rem);"></i>
                <span style="color: var(--text-color-secondary); font-size: var(--nph-font-size-body-sm, 14px);">Dashboard</span>
              </div>
              
              <!-- Actions -->
              <div class="topbar-actions">
                <!-- Notificações -->
                <button class="notification-button">
                  <i class="fa-solid fa-bell"></i>
                </button>
                
                <!-- Seletor de Idioma -->
                <div class="language-selector">

                    <img src="https://assets-services.sdasystems.org/images/flags/1x1/br.svg" alt="PT-BR" style="width: 100%; height: 100%; object-fit: cover; border-radius: 21px;" />
                  </div>
                  <div class="language-label">
                    <span>Pt-Bra</span>
                    <i class="fa-solid fa-chevron-down"></i>
                  </div>
                </div>
              </div>
            </div>
          </header>

              <div class="card"></div>

              <div class="card"></div>
            </div>
            
            <!-- Área principal -->

              <div class="card-large">
                <router-outlet></router-outlet>
              </div>
              <div class="card-sidebar"></div>
            </div>
          </div>
        </div>
